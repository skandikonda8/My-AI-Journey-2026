<!DOCTYPE html>
<html>

<head>
    <title>My AI Chatbot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        .chat-container {
            width: 600px;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #cccccc;
        }

        h1 {
            text-align: center;
        }

        #chat-box {
            height: 400px;
            border: 1px solid #cccccc;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .user-message {
            text-align: right;
            margin: 10px;
            color: blue;
        }

        .bot-message {
            text-align: left;
            margin: 10px;
            color: green;
            white-space: pre-wrap;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        #message-input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .clear-button {
            margin-top: 15px;
            width: 100%;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <h1>My AI Chatbot</h1>

        <div id="chat-box">
            <div class="bot-message">
                AI: Hello! Ask me anything.
            </div>
        </div>

        <div class="input-container">
            <input
                id="message-input"
                type="text"
                placeholder="Type your message..."
            >

            <button onclick="sendMessage()">
                Send
            </button>
        </div>

        <button
            class="clear-button"
            onclick="clearChat()"
        >
            New Chat
        </button>

    </div>

    <script>


        // --------------------------------
        // CREATE CONVERSATION ID
        // --------------------------------
        
        let conversationId = crypto.randomUUID();
        
        
        // --------------------------------
        // SEND MESSAGE
        // --------------------------------
        
        async function sendMessage() {
        
        
            const input =
                document.getElementById("message-input");
        
        
            const message =
                input.value;
        
        
            if (message.trim() === "") {
                return;
            }
        
        
            const chatBox =
                document.getElementById("chat-box");
        
        
            // --------------------------------
            // Show user message
            // --------------------------------
        
            const userMessage =
                document.createElement("div");
        
        
            userMessage.className =
                "user-message";
        
        
            userMessage.textContent =
                "You: " + message;
        
        
            chatBox.appendChild(userMessage);
        
        
            // Clear input
            input.value = "";
        
        
            // --------------------------------
            // Create empty AI message
            // --------------------------------
        
            const botMessage =
                document.createElement("div");
        
        
            botMessage.className =
                "bot-message";
        
        
            botMessage.textContent =
                "AI: ";
        
        
            chatBox.appendChild(botMessage);
        
        
            // --------------------------------
            // Send POST request
            // --------------------------------
        
            const response =
                await fetch("/chat", {
        
                    method: "POST",
        
                    headers: {
                        "Content-Type": "application/json"
                    },
        
                    body: JSON.stringify({
        
                        conversation_id:
                            conversationId,
        
                        message:
                            message
        
                    })
        
                });
        
        
            // --------------------------------
            // Check for server error
            // --------------------------------
        
            if (!response.ok) {
        
                botMessage.textContent +=
                    "Something went wrong.";
        
                return;
            }
        
        
            // --------------------------------
            // Get streaming reader
            // --------------------------------
        
            const reader =
                response.body.getReader();
        
        
            // Converts bytes into text
            const decoder =
                new TextDecoder();
        
        
            // --------------------------------
            // Read stream continuously
            // --------------------------------
        
            while (true) {
        
        
                const { done, value } =
                    await reader.read();
        
        
                if (done) {
        
                    break;
        
                }
        
        
                // Convert incoming bytes
                // into readable text
        
                const chunk =
                    decoder.decode(
                        value,
                        { stream: true }
                    );
        
        
                // Add chunk to AI message
        
                botMessage.textContent +=
                    chunk;
        
        
                // Scroll down automatically
        
                chatBox.scrollTop =
                    chatBox.scrollHeight;
        
            }
        
        }
        
        
        
        // --------------------------------
        // CLEAR CHAT
        // --------------------------------
        
        async function clearChat() {
        
        
            const response =
                await fetch("/clear", {
        
                    method: "POST",
        
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
        
                    body: JSON.stringify({
        
                        conversation_id:
                            conversationId
        
                    })
        
                });
        
        
            await response.json();
        
        
            // New conversation ID
            conversationId =
                crypto.randomUUID();
        
        
            const chatBox =
                document.getElementById(
                    "chat-box"
                );
        
        
            chatBox.innerHTML =
                `<div class="bot-message">
                    AI: New conversation started. Ask me anything.
                </div>`;
        
        }
        
        
        
        // --------------------------------
        // PRESS ENTER TO SEND
        // --------------------------------
        
        document
            .getElementById("message-input")
            .addEventListener(
                "keypress",
                function(event) {
        
                    if (event.key === "Enter") {
        
                        sendMessage();
        
                    }
        
                }
            );
        
        
        </script>
