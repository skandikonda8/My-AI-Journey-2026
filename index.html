<!DOCTYPE html>
<html>

<head>

    <title>My AI Chatbot</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;

            display: flex;
            justify-content: center;

            padding-top: 50px;
        }


        .chat-container {

            width: 600px;

            background-color: white;

            padding: 20px;

            border-radius: 10px;

            box-shadow: 0px 0px 10px #cccccc;
        }


        h1 {
            text-align: center;
        }


        #chat-box {

            height: 400px;

            border: 1px solid #cccccc;

            padding: 15px;

            overflow-y: auto;

            margin-bottom: 20px;
        }


        .user-message {

            text-align: right;

            margin: 10px;

            color: blue;
        }


        .bot-message {

            text-align: left;

            margin: 10px;

            color: green;
        }


        .input-container {

            display: flex;

            gap: 10px;
        }


        #message-input {

            flex: 1;

            padding: 10px;

            font-size: 16px;
        }


        button {

            padding: 10px 20px;

            font-size: 16px;

            cursor: pointer;
        }


        .clear-button {

            margin-top: 15px;

            width: 100%;
        }

    </style>

</head>


<body>


<div class="chat-container">


    <h1>My AI Chatbot</h1>


    <div id="chat-box">

        <div class="bot-message">
            AI: Hello! Ask me anything.
        </div>

    </div>


    <div class="input-container">

        <input
            id="message-input"
            type="text"
            placeholder="Type your message..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>


    <button
        class="clear-button"
        onclick="clearChat()"
    >
        New Chat
    </button>


</div>


<script>


// --------------------------------
// SEND MESSAGE
// --------------------------------

async function sendMessage() {


    const input =
        document.getElementById("message-input");


    const message =
        input.value;


    if (message.trim() === "") {
        return;
    }


    const chatBox =
        document.getElementById("chat-box");


    chatBox.innerHTML +=
        `<div class="user-message">
            You: ${message}
        </div>`;


    input.value = "";


    const response =
        await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });


    const data =
        await response.json();


    chatBox.innerHTML +=
        `<div class="bot-message">
            AI: ${data.bot_response}
        </div>`;


    chatBox.scrollTop =
        chatBox.scrollHeight;
}



// --------------------------------
// CLEAR CHAT
// --------------------------------

async function clearChat() {


    const response =
        await fetch("/clear", {

            method: "POST"

        });


    const data =
        await response.json();


    console.log(data);


    const chatBox =
        document.getElementById("chat-box");


    chatBox.innerHTML =
        `<div class="bot-message">
            AI: New conversation started. Ask me anything.
        </div>`;
}



// --------------------------------
// PRESS ENTER TO SEND
// --------------------------------

document
    .getElementById("message-input")
    .addEventListener(
        "keypress",
        function(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        }
    );


</script>


</body>

</html>
